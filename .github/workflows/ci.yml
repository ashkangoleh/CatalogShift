name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install ruff==0.12.11
      - run: make quality
      - run: make config
      - run: docker compose --profile ui build polaris-console

  migration-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - run: make e2e
        env:
          KEEP_STACK: "1"
      - if: always()
        run: docker compose --profile tools logs --no-color > migration-e2e.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: migration-e2e-log
          path: migration-e2e.log
          retention-days: 7
      - if: always()
        run: docker compose --profile tools down --volumes --remove-orphans
